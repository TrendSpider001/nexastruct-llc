<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Sheetline</title>
    <script src="js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="app-page" data-page="dashboard">
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Main navigation">
        <p class="app-sidebar__brand">Sheetline</p>
        <nav class="app-sidebar__nav">
          <a class="app-sidebar__link" href="dashboard.html" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 13h7V4H4v9Zm9 7h7V11h-7v9ZM4 20h7v-5H4v5Zm9-11h7V4h-7v5Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            Dashboard
          </a>
          <a class="app-sidebar__link" href="users.html" data-nav="users">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Users
          </a>
          <a class="app-sidebar__link" href="data.html" data-nav="data">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 6h16M4 12h16M4 18h10"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            Data
          </a>
          <a class="app-sidebar__link" href="settings.html" data-nav="settings">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.1.7.6 1.2 1.5 1.3H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            Settings
          </a>
        </nav>
        <div class="app-sidebar__footer">
          <p class="app-sidebar__user">
            Signed in as
            <strong data-session-user></strong>
          </p>
          <button type="button" class="app-sidebar__logout" data-logout>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <button class="app-overlay" id="sidebar-overlay" aria-label="Close menu"></button>

      <header class="app-navbar">
        <div class="app-navbar__left">
          <button
            type="button"
            class="app-navbar__menu"
            id="sidebar-toggle"
            aria-label="Open sidebar"
          >
            ☰
          </button>
          <p class="app-navbar__title">Dashboard</p>
        </div>
        <div class="app-navbar__actions">
          <button
            type="button"
            class="app-theme-toggle"
            data-theme-toggle
            data-icon-toggle
            aria-label="Toggle theme"
          ></button>
        </div>
      </header>

      <div class="app-main">
        <div class="page-head-row">
          <div>
            <h1 class="app-page-title">Dashboard</h1>
            <p class="app-page-sub">
              Overview of your sheet records and signed-in accounts.
            </p>
          </div>
          <button type="button" class="users-form__submit data-refresh-btn" id="refresh-data-btn">
            Refresh from Google Sheet
          </button>
        </div>

        <section class="stat-row" aria-label="Dashboard stats">
          <article class="stat">
            <p class="stat__label">All data</p>
            <p class="stat__value" id="stat-all">0 / 0</p>
            <p class="stat__hint">Total / with mail</p>
          </article>
          <article class="stat">
            <p class="stat__label">Today</p>
            <p class="stat__value" id="stat-today">0 / 0</p>
            <p class="stat__hint">Found today / with mail</p>
          </article>
          <article class="stat">
            <p class="stat__label">Users</p>
            <p class="stat__value" id="stat-users">0</p>
            <p class="stat__hint">Login accounts</p>
          </article>
        </section>

        <section class="chart-panel" aria-label="Items by date">
          <div class="chart-panel__head">
            <div>
              <h2 class="chart-panel__title">Items by date</h2>
              <p class="chart-panel__sub">Last 10 days · updates live</p>
            </div>
            <p class="chart-panel__live" id="chart-live">
              <span class="chart-panel__dot" aria-hidden="true"></span>
              Live
            </p>
          </div>
          <div class="chart-panel__canvas-wrap">
            <canvas id="items-by-date-chart" aria-label="Bar chart of total items, items with email, and items with attachments by date"></canvas>
          </div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/users-store.js"></script>
    <script src="js/settings-store.js"></script>
    <script src="js/timezone.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
