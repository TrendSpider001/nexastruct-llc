<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data · Sheetline</title>
    <script src="js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="app-page" data-page="data">
    <div class="app-shell">
      <aside class="app-sidebar" aria-label="Main navigation">
        <p class="app-sidebar__brand">Sheetline</p>
        <nav class="app-sidebar__nav">
          <a class="app-sidebar__link" href="dashboard.html" data-nav="dashboard">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 13h7V4H4v9Zm9 7h7V11h-7v9ZM4 20h7v-5H4v5Zm9-11h7V4h-7v5Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            Dashboard
          </a>
          <a class="app-sidebar__link" href="users.html" data-nav="users">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Users
          </a>
          <a class="app-sidebar__link" href="data.html" data-nav="data">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 6h16M4 12h16M4 18h10"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            Data
          </a>
          <a class="app-sidebar__link" href="settings.html" data-nav="settings">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.1.7.6 1.2 1.5 1.3H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
            Settings
          </a>
        </nav>
        <div class="app-sidebar__footer">
          <p class="app-sidebar__user">
            Signed in as
            <strong data-session-user></strong>
          </p>
          <button type="button" class="app-sidebar__logout" data-logout>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <button class="app-overlay" id="sidebar-overlay" aria-label="Close menu"></button>

      <header class="app-navbar">
        <div class="app-navbar__left">
          <button
            type="button"
            class="app-navbar__menu"
            id="sidebar-toggle"
            aria-label="Open sidebar"
          >
            ☰
          </button>
          <p class="app-navbar__title">Data</p>
        </div>
        <div class="app-navbar__actions">
          <button
            type="button"
            class="app-theme-toggle"
            data-theme-toggle
            data-icon-toggle
            aria-label="Toggle theme"
          ></button>
        </div>
      </header>

      <div class="app-main">
        <h1 class="app-page-title">Data</h1>
        <p class="app-page-sub">
          Live records from your Google Sheet, with pagination.
        </p>
        <p class="data-status" id="data-status" hidden></p>

        <div class="data-toolbar">
          <label class="data-toolbar__field">
            <span>Show</span>
            <select id="filter-content">
              <option value="all">All projects</option>
              <option value="email">With email</option>
              <option value="attachments">With attachments</option>
            </select>
          </label>
          <label class="data-toolbar__field">
            <span>Project Type</span>
            <select id="filter-project-type">
              <option value="">All types</option>
            </select>
          </label>
          <label class="data-toolbar__field">
            <span>Date sort</span>
            <select id="sort-date">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </label>
          <button type="button" class="users-form__submit data-refresh-btn" id="refresh-data-btn">
            Refresh from Google Sheet
          </button>
          <p class="data-meta" id="data-meta">Loading…</p>
        </div>

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Date</th>
                <th>Name</th>
                <th>Project Type</th>
                <th>Location</th>
                <th>Time</th>
                <th>Mail</th>
                <th>Thatsthem</th>
                <th>Attachments</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody id="data-table-body">
              <tr>
                <td colspan="10">Loading Google Sheet…</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pager" id="data-pagination" aria-label="Pagination"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/users-store.js"></script>
    <script src="js/settings-store.js"></script>
    <script src="js/timezone.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/data-page.js"></script>
  </body>
</html>
