<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Sheetline</title>
    <script src="js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page">
    <button
      type="button"
      class="login-theme"
      data-theme-toggle
      data-icon-toggle
      aria-label="Toggle theme"
    ></button>

    <main class="login-shell">
      <section class="login-brand" aria-label="Sheetline">
        <p class="login-brand__mark">Sheetline</p>
        <h1 class="login-brand__headline">Sign in to platform</h1>
        <p class="login-brand__sub">
          Access your Google Sheet dashboard, data, and team accounts.
        </p>
      </section>

      <form class="login-form" id="login-form" novalidate>
        <div class="login-form__field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Enter username"
            required
          />
        </div>

        <div class="login-form__field">
          <label for="password">Password</label>
          <div class="login-form__password">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="login-form__toggle"
              id="toggle-password"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <p class="login-form__error" id="login-error" hidden role="alert"></p>

        <button type="submit" class="login-form__submit" id="login-submit">
          <span>Sign in</span>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M4 10h12m0 0-4-4m4 4-4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/users-store.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
